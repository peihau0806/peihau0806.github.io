<header>

<main>
    <section class="container">

        <div class="card">
            <img src="images/8.jpg" alt="我的照片" class="profile-img">
            <h3>期中週</h3>
            <p>每天都在懷疑人生，但還是活著寫完這個網站。</p>
        </div>

        <div class="card">
            <img src="images/9.jpg" alt="我的照片" class="profile-img">
            <h3>打工人生</h3>
            <p>在滷味店打工，順便思考人生方向（還是沒想出來）。</p>
        </div>

        <div class="card">
            <img src="images/10.jpg" alt="我的照片" class="profile-img">
            <h3>快樂來源</h3>
            <p>音樂、遊戲、半夜吃宵夜，還有偶爾的靈感爆發。</p>
        </div>

        <div class="card">
            <img src="images/11.jpg" alt="我的照片" class="profile-img">
            <h3>睡眠不足俱樂部</h3>
            <p>每天都想早睡，但每天都失敗，最後跟太陽一起睡。</p>
        </div>

        <div class="card">
            <img src="images/12.png" alt="我的照片" class="profile-img">
            <h3>拖延症發作</h3>
            <p>明明有很多事要做，但我選擇先發呆、滑手機、再焦慮。</p>
        </div>

        <div class="card">
            <img src="images/13.jpg" alt="我的照片" class="profile-img">
            <h3>突然努力一下</h3>
            <p>在某個瞬間突然燃起鬥志，然後做完一件事又開始躺平。</p>
        </div>

    </section>
